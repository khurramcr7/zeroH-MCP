name: zeroH MCP CI & Proprietary IP Guard

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify-and-audit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest sympy
          pip install -e .

      - name: Run Proprietary Formula Non-Exposure Security Audit
        run: |
          python scripts/security_audit_no_leaks.py

      - name: Run Public MCP & Verification Test Suite
        run: |
          pytest -v
