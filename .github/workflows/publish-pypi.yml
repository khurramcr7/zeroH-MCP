name: Publish zeroH-MCP to PyPI & Official MCP Registry

on:
  release:
    types: [published]
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  audit-test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build & test dependencies
        run: |
          python -m pip install --upgrade pip build twine pytest
          pip install -e .

      - name: Run 100% Black-Box IP & Non-Leakage Security Audit
        run: python scripts/security_audit_no_leaks.py

      - name: Run Deterministic Verification & SDK Test Suite
        run: pytest -v

      - name: Build sdist and wheel
        run: python -m build

      - name: Verify package metadata
        run: twine check dist/*

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

  publish-to-pypi:
    needs: audit-test-and-build
    if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/zeroh-mcp
    steps:
      - name: Download built artifacts
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish distribution to PyPI via Trusted Publisher
        uses: pypa/gh-action-pypi-publish@release/v1
